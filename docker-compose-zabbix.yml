services:
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_USER=${ZABBIX_DB_USER}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASS}
      - POSTGRES_DB=zabbix
    depends_on:
      - zabbix-postgres
    deploy:
      resources:
        limits:
          memory: 350M # Limite rígido para economizar RAM do servidor

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    ports:
      - "8087:8080" # Acessível via http://IP_DO_SERVIDOR:8087 (evita conflito com Pi-hole)
    environment:
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_USER=${ZABBIX_DB_USER}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASS}
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=America/Sao_Paulo
    depends_on:
      - zabbix-server
      - zabbix-postgres
    deploy:
      resources:
        limits:
          memory: 250M

  zabbix-postgres:
    image: postgres:15-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${ZABBIX_DB_USER}
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASS}
      - POSTGRES_DB=zabbix
    volumes:
      - ./zabbix_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M # Limita o banco para não competir com outros serviços

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    privileged: true
    pid: "host"
    network_mode: "host"
    environment:
      - ZBX_HOSTNAME=${ZABBIX_AGENT_HOSTNAME}
      - ZBX_SERVER_HOST=0.0.0.0/0
      - ZBX_ACTIVE_ALLOW=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
